plugins {
    id 'java-gradle-plugin'
    id 'maven-publish'
    id 'com.gradle.plugin-publish'
}

def pluginArtifactId = 'jira-mark-gradle-plugin'

base {
    archivesName = pluginArtifactId
}

publishing {
    publications.withType(MavenPublication).configureEach {
        if (name == 'pluginMaven') {
            artifactId = pluginArtifactId
        }
    }
}

gradlePlugin {
    website = 'https://github.com/ushulau/jira-mark'
    vcsUrl = 'https://github.com/ushulau/jira-mark.git'

    plugins {
        jiraMark {
            id = 'dev.vspex.jira-mark'
            displayName = 'Jira Mark'
            description = 'Define reusable Jira ticket profiles with YAML configuration and Markdown guidance stored in your repository. Preview ticket drafts offline, validate fields against Jira Cloud, import profiles from existing issues, and create issues through explicit Gradle tasks.'
            tags = ['jira', 'automation', 'markdown']
            implementationClass = 'dev.vspex.jira.mark.gradle.JiraMarkPlugin'
            compatibility(it) {
                features {
                    configurationCache = true
                }
            }
        }
    }
}

dependencies {
    // Bundle our own core; retain SnakeYAML as a normal published runtime dependency.
    compileOnly project(':core')
    compileOnly project(':jira-cloud')
    implementation "org.yaml:snakeyaml:${rootProject.ext.snakeYamlVersion}"
    testImplementation project(':core')
}
tasks.named('jar', Jar) {
    from(project(':core').sourceSets.main.output)
    from(project(':jira-cloud').sourceSets.main.output)
}
tasks.named('pluginUnderTestMetadata') {
    pluginClasspath.from(project(':core').sourceSets.main.output)
    pluginClasspath.from(project(':jira-cloud').sourceSets.main.output)
}

testing {
    suites {
        functionalTest(JvmTestSuite) {
            useJUnitJupiter()
            dependencies {
                implementation project()
                implementation project(':core')
                implementation gradleTestKit()
                implementation "org.junit.jupiter:junit-jupiter:${rootProject.ext.junitBomVersion}"
            }
        }
    }
}
tasks.named('processFunctionalTestResources') { from(tasks.named('pluginUnderTestMetadata')) }
tasks.named('check') { dependsOn testing.suites.functionalTest }

tasks.named('functionalTest', Test) {
    dependsOn tasks.named('jar')
    systemProperty 'jiraMark.pluginJar', tasks.named('jar', Jar).get().archiveFile.get().asFile.absolutePath
}
